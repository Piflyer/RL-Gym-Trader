algorithm:
  class_name: PPO
  normalize_advantage_per_mini_batch: false
  # value function parameters
  value_loss_coef: 1.0
  clip_param: 0.2
  use_clipped_value_loss: true
  # surrogate loss parameters
  desired_kl: 0.01
  entropy_coef: 0.01
  gamma: 0.99
  lam: 0.95
  max_grad_norm: 1.0
  # training parameters
  learning_rate: 0.001
  num_learning_epochs: 5
  num_mini_batches: 4
  schedule: adaptive

policy:
  class_name: ActorCritic
  activation: elu
  init_noise_std: 1.0
  actor_hidden_dims: [512, 256, 128]
  critic_hidden_dims: [512, 256, 128]
  noise_std_type: scalar

save_interval: 1
experiment_name: stock_trader_RK # set this in the code
empirical_normalization: False
num_steps_per_env: 1000
runner_class_name: OnPolicyRunner
logger: tensorboard
seed: 1